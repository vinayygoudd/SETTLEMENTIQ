[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "settlementiq"
version = "1.0.0"
description = "End-to-End FinTech Payment Settlement, Reconciliation & Financial Leakage Analytics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "openpyxl>=3.1.0",
    "xlsxwriter>=3.1.0",
    "python-pptx>=0.6.21",
    "pytest>=7.4.0",
]

[project.scripts]
settlementiq = "settlementiq.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
